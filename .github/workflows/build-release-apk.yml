name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        run: |
          # 去除 secret 中可能混入的空白（换行/空格），避免 base64 被截断或污染导致密钥库损坏
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/my-release-key.jks
          echo "decoded keystore size: $(wc -c < android/my-release-key.jks) bytes"

      - name: Verify keystore
        run: |
          echo "== file type =="
          file android/my-release-key.jks || true
          echo "== keytool list (validates store is readable) =="
          keytool -list -keystore android/my-release-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" || {
            echo "ERROR: keystore unreadable — base64 secret likely truncated/corrupted or store password wrong"
            exit 1
          }

      - name: Generate keystore.properties
        working-directory: android
        run: |
          echo "storeFile=my-release-key.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Ensure Gradle Wrapper
        if: ${{ !hashFiles('android/gradlew') }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: wrapper
          build-root-directory: android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with APK
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Panorama Viewer ${{ github.ref_name }}
          body: |
            Panorama Viewer ${{ github.ref_name }} automated release.
            This release includes the officially signed APK.
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk

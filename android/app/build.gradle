plugins {
    id 'com.android.application'
}

// 读取 keystore.properties（正式版签名用）。文件不存在时不影响 debug 构建；
// 但只要执行 assembleRelease，就必须存在该文件并提供正确的密钥信息。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.panoviewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.panoviewer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 正式版签名配置：仅在 keystore.properties 存在时生效
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // 密钥库与 keystore.properties 同目录（android/），按 rootProject 解析，
                // 落到 android/my-release-key.jks，与 CI 写入密钥库的路径一致。
                storeFile rootProject.file(keystoreProperties['storeFile'])
                // 密钥库由现代 JDK(9+) 的 keytool 生成，默认即 PKCS12 格式（即使扩展名是 .jks）。
                // 必须显式声明为 PKCS12，否则 AGP 按 JKS 解析会报 "Tag number over 30 is not supported"。
                // 若未来改用真正的 JKS 密钥库，请同步把此值改为 'JKS'。
                storeType 'PKCS12'
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 正式发布版：用自有密钥签名 + 开启混淆压缩
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试版：使用 Android 默认 debug 密钥，无需 keystore.properties
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅依赖 AppCompat 提供 AppCompatActivity / 主题，保持最小依赖、离线可构建
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
